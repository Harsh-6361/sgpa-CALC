<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA Quest - Level Up Your Grades!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #20232a;
            color: #61dafb;
            text-align: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #282c34;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        /* User Info Section */
        .user-info {
            background: #393e46;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #61dafb;
        }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #61dafb;
            border-radius: 10px;
            background-color: #20232a;
            color: #61dafb;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #38a1db;
            box-shadow: 0 0 0 3px rgba(97, 218, 251, 0.1);
        }
        /* Table wrapper for mobile scrolling */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            min-width: 500px;
        }
        table, th, td {
            border: none;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #61dafb;
            color: #20232a;
            font-weight: bold;
            border-radius: 10px;
            font-size: 14px;
        }
        td {
            background-color: #393e46;
            border-radius: 10px;
        }
        td input[type="number"] {
            width: 90%;
            padding: 10px;
            border: 2px solid #61dafb;
            border-radius: 10px;
            background-color: #20232a;
            color: #61dafb;
            text-align: center;
            font-size: 16px;
        }
        .btn {
            padding: 12px 28px;
            background-color: #61dafb;
            color: #20232a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 8px;
            transition: transform 0.2s, background-color 0.3s;
            min-height: 44px; /* Touch target size for mobile */
            touch-action: manipulation;
        }
        .btn:hover {
            background-color: #38a1db;
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-remove {
            padding: 8px 16px;
            font-size: 14px;
            min-height: 40px;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            line-height: 1.6;
        }
        .result span {
            color: #f8c445;
            font-weight: bold;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
            color: #f8c445;
            line-height: 1.5;
            padding: 15px;
            background: rgba(248, 196, 69, 0.1);
            border-radius: 10px;
        }
        .avatar {
            display: block;
            margin: 20px auto;
            width: 100px;
            height: 100px;
            background: url('Designer.jpeg') no-repeat center center;
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        footer {
            background-color: #20232a;
            padding: 15px;
            margin-top: 40px;
            color: #61dafb;
            border-radius: 15px;
        }
        #printBtn {
            display: none;
        }

        /* Mobile-first responsive design */
        @media only screen and (min-width: 600px) {
            body {
                padding: 20px;
            }
            .container {
                padding: 30px;
            }
            h2 {
                font-size: 28px;
            }
            .avatar {
                width: 120px;
                height: 120px;
            }
        }
        
        /* Small mobile optimization */
        @media only screen and (max-width: 400px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            h2 {
                font-size: 20px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
                margin: 5px;
            }
            th, td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 SGPA Calculator! 🎮</h2>
        <div class="avatar"></div>
        
        <!-- User Information Section -->
        <div class="user-info">
            <div class="form-group">
                <label for="usn">📝 University Serial Number (USN)</label>
                <input type="text" id="usn" placeholder="Enter your USN (e.g., 1AB21CS001)" required onblur="loadUserData()">
            </div>
            <div class="form-group">
                <label for="semester">📅 Semester Number</label>
                <input type="number" id="semester" min="1" max="8" placeholder="Enter semester (1-8)" required onchange="loadSemesterData()">
            </div>
            <div id="userStatus" style="margin-top: 15px; padding: 10px; border-radius: 8px; display: none;"></div>
            <div id="cgpaDisplay" style="margin-top: 15px; padding: 15px; background: #20232a; border-radius: 8px; display: none;">
                <h3 style="margin-top: 0; color: #f8c445;">📊 Your Academic Summary</h3>
                <div id="semesterList"></div>
                <div id="cgpaValue" style="font-size: 20px; margin-top: 15px; font-weight: bold;"></div>
            </div>
        </div>
        
        <div class="table-wrapper">
        <table id="gradeTable">
            <thead>
                <tr>
                    <th>📚 Credits (Ci)</th>
                    <th>✏️ Marks</th>
                    <th>🏆 Grade Point (Gi)</th>
                    <th>🛠️ Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="number" placeholder="Credits" required></td>
                    <td><input type="number" placeholder="Marks" required></td>
                    <td><input type="number" placeholder="Grade Point" readonly></td>
                    <td><button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button></td>
                </tr>
            </tbody>
        </table>
        </div>
        <button class="btn" onclick="addRow()">➕ Add Subject</button>
        <button class="btn" onclick="calculateSGPA()">💯 Calculate SGPA</button>
        <div class="result" id="result"></div>
        <div class="message" id="message"></div>
        <button class="btn" id="printBtn" onclick="printResult()">🖨️ Print Result</button>
    </div>

    <script>
        function addRow() {
            var table = document.getElementById("gradeTable").getElementsByTagName('tbody')[0];
            var row = table.insertRow(-1);
            var cell1 = row.insertCell(0);
            var cell2 = row.insertCell(1);
            var cell3 = row.insertCell(2);
            var cell4 = row.insertCell(3);
            
            cell1.innerHTML = '<input type="number" placeholder="Credits" required>';
            cell2.innerHTML = '<input type="number" placeholder="Marks" required>';
            cell3.innerHTML = '<input type="number" placeholder="Grade Point" readonly>';
            cell4.innerHTML = '<button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button>';
        }
        function removeRow(btn) {
            var row = btn.parentNode.parentNode;
            row.remove();
        }
        
        // Load user data when USN is entered
        function loadUserData() {
            const usn = document.getElementById('usn').value.trim().toUpperCase();
            if (!usn) return;
            
            const userData = getUserData(usn);
            const statusDiv = document.getElementById('userStatus');
            const cgpaDiv = document.getElementById('cgpaDisplay');
            
            if (userData && Object.keys(userData.semesters).length > 0) {
                // Existing user - use textContent to prevent XSS
                statusDiv.textContent = `✅ Welcome back, ${usn}! Your data has been found.`;
                statusDiv.style.backgroundColor = '#2d5016';
                statusDiv.style.display = 'block';
                
                // Display CGPA and semester summary
                displayCGPA(userData);
            } else {
                // New user - use textContent to prevent XSS
                statusDiv.textContent = `👋 Welcome ${usn}! You're a new user. Please register your marks for all 8 semesters.`;
                statusDiv.style.backgroundColor = '#5a3e1b';
                statusDiv.style.display = 'block';
                cgpaDiv.style.display = 'none';
            }
        }
        
        // Load semester data when semester number is changed
        function loadSemesterData() {
            const usn = document.getElementById('usn').value.trim().toUpperCase();
            const semester = parseInt(document.getElementById('semester').value);
            
            if (!usn || !semester) return;
            
            const userData = getUserData(usn);
            if (userData && userData.semesters[semester]) {
                const semData = userData.semesters[semester];
                
                // Clear existing table rows
                const table = document.getElementById("gradeTable").getElementsByTagName('tbody')[0];
                table.innerHTML = '';
                
                // Load saved subjects - properly escape values
                semData.subjects.forEach(subject => {
                    const row = table.insertRow(-1);
                    const creditsInput = document.createElement('input');
                    creditsInput.type = 'number';
                    creditsInput.placeholder = 'Credits';
                    creditsInput.value = subject.credits;
                    creditsInput.required = true;
                    row.insertCell(0).appendChild(creditsInput);
                    
                    const marksInput = document.createElement('input');
                    marksInput.type = 'number';
                    marksInput.placeholder = 'Marks';
                    marksInput.value = subject.marks;
                    marksInput.required = true;
                    row.insertCell(1).appendChild(marksInput);
                    
                    const gradeInput = document.createElement('input');
                    gradeInput.type = 'number';
                    gradeInput.placeholder = 'Grade Point';
                    gradeInput.value = subject.gradePoint;
                    gradeInput.readOnly = true;
                    row.insertCell(2).appendChild(gradeInput);
                    
                    row.insertCell(3).innerHTML = '<button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button>';
                });
                
                // Display SGPA for this semester - using textContent for data
                const resultDiv = document.getElementById("result");
                resultDiv.innerHTML = '';
                resultDiv.appendChild(document.createTextNode('Saved SGPA for Semester ' + semester + ': '));
                const sgpaSpan = document.createElement('span');
                sgpaSpan.textContent = semData.sgpa;
                resultDiv.appendChild(sgpaSpan);
                resultDiv.appendChild(document.createElement('br'));
                resultDiv.appendChild(document.createTextNode('Equivalent to: '));
                const percentSpan = document.createElement('span');
                percentSpan.textContent = semData.percentage + '%';
                resultDiv.appendChild(percentSpan);
                
                document.getElementById("message").textContent = semData.message || '';
            }
        }
        
        // Get user data from localStorage
        function getUserData(usn) {
            try {
                const allUsers = JSON.parse(localStorage.getItem('sgpaUsers') || '{}');
                return allUsers[usn] || null;
            } catch (e) {
                console.error('Error loading user data:', e);
                return null;
            }
        }
        
        // Save user data to localStorage
        function saveUserData(usn, semesterData) {
            try {
                const allUsers = JSON.parse(localStorage.getItem('sgpaUsers') || '{}');
                
                if (!allUsers[usn]) {
                    allUsers[usn] = {
                        usn: usn,
                        semesters: {},
                        createdAt: new Date().toISOString()
                    };
                }
                
                allUsers[usn].semesters[semesterData.semester] = semesterData;
                allUsers[usn].lastUpdated = new Date().toISOString();
                
                localStorage.setItem('sgpaUsers', JSON.stringify(allUsers));
                console.log('User data saved:', allUsers[usn]);
                
                return allUsers[usn];
            } catch (e) {
                console.error('Error saving user data:', e);
                return null;
            }
        }
        
        // Calculate and display CGPA
        function displayCGPA(userData) {
            const cgpaDiv = document.getElementById('cgpaDisplay');
            const semesterList = document.getElementById('semesterList');
            const cgpaValue = document.getElementById('cgpaValue');
            
            const semesters = userData.semesters;
            const semesterNumbers = Object.keys(semesters).map(Number).sort((a, b) => a - b);
            
            if (semesterNumbers.length === 0) {
                cgpaDiv.style.display = 'none';
                return;
            }
            
            // Display list of semesters - use DOM methods to avoid XSS
            const listContainer = document.createElement('div');
            listContainer.style.cssText = 'display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px;';
            
            semesterNumbers.forEach(sem => {
                const semData = semesters[sem];
                const semBox = document.createElement('div');
                semBox.style.cssText = 'background: #393e46; padding: 10px; border-radius: 8px; text-align: center;';
                
                const semLabel = document.createElement('div');
                semLabel.style.cssText = 'font-weight: bold; color: #61dafb;';
                semLabel.textContent = 'Sem ' + sem;
                
                const sgpaLabel = document.createElement('div');
                sgpaLabel.style.cssText = 'font-size: 18px; color: #f8c445;';
                sgpaLabel.textContent = 'SGPA: ' + semData.sgpa;
                
                semBox.appendChild(semLabel);
                semBox.appendChild(sgpaLabel);
                listContainer.appendChild(semBox);
            });
            
            semesterList.innerHTML = '';
            semesterList.appendChild(listContainer);
            
            // Calculate CGPA with division by zero check
            let totalCredits = 0;
            let totalCiGi = 0;
            
            semesterNumbers.forEach(sem => {
                const semData = semesters[sem];
                totalCredits += semData.totalCredits || 0;
                totalCiGi += semData.totalCiGi || 0;
            });
            
            // Prevent division by zero
            if (totalCredits === 0) {
                cgpaValue.textContent = 'No valid credit data available';
                cgpaDiv.style.display = 'block';
                return;
            }
            
            const cgpa = totalCiGi / totalCredits;
            const cgpaPercentage = (cgpa - 0.75) * 10;
            
            // Build CGPA display using DOM methods
            cgpaValue.innerHTML = '';
            
            const cgpaLine = document.createElement('div');
            cgpaLine.style.cssText = 'color: #f8c445;';
            cgpaLine.appendChild(document.createTextNode(
                'CGPA (' + semesterNumbers.length + ' semester' + 
                (semesterNumbers.length > 1 ? 's' : '') + '): '
            ));
            const cgpaSpan = document.createElement('span');
            cgpaSpan.style.fontSize = '24px';
            cgpaSpan.textContent = cgpa.toFixed(2);
            cgpaLine.appendChild(cgpaSpan);
            
            const percentLine = document.createElement('div');
            percentLine.style.cssText = 'color: #61dafb; margin-top: 5px;';
            percentLine.appendChild(document.createTextNode('Equivalent to: '));
            const percentSpan = document.createElement('span');
            percentSpan.style.fontSize = '20px';
            percentSpan.textContent = cgpaPercentage.toFixed(2) + '%';
            percentLine.appendChild(percentSpan);
            
            cgpaValue.appendChild(cgpaLine);
            cgpaValue.appendChild(percentLine);
            
            cgpaDiv.style.display = 'block';
        }
        
        // Function to save data to JSON file (localStorage for browser) - LEGACY SUPPORT
        function saveToJSON(data) {
            // Keep legacy function for backward compatibility
            // New data structure is handled by saveUserData
            console.log('Legacy save function called, data managed by new structure');
        }
        
        function calculateSGPA() {
            // Validate USN and Semester
            const usn = document.getElementById('usn').value.trim().toUpperCase();
            const semester = parseInt(document.getElementById('semester').value);
            
            if (!usn) {
                alert('⚠️ Please enter your USN');
                document.getElementById('usn').focus();
                return;
            }
            
            if (!semester || semester < 1 || semester > 8) {
                alert('⚠️ Please enter a valid semester number (1-8)');
                document.getElementById('semester').focus();
                return;
            }
            
            var table = document.getElementById("gradeTable");
            var totalCi = 0;
            var totalCiGi = 0;
            var calculationDetails = "";
            var subjects = [];

            for (var i = 1, row; row = table.rows[i]; i++) {
                var credits = parseInt(row.cells[0].children[0].value);
                var marks = parseInt(row.cells[1].children[0].value);
                
                if (isNaN(credits) || isNaN(marks)) {
                    alert('⚠️ Please fill in all credits and marks');
                    return;
                }
                
                if (credits <= 0) {
                    alert('⚠️ Credits must be greater than zero');
                    return;
                }
                
                if (marks < 0 || marks > 100) {
                    alert('⚠️ Marks must be between 0 and 100');
                    return;
                }
                
                var gradePoint = getGradePoint(marks);
                var ciGi = credits * gradePoint;
                row.cells[2].children[0].value = gradePoint;

                totalCi += credits;
                totalCiGi += ciGi;
                
                // Store subject data
                subjects.push({
                    subjectNumber: i,
                    credits: credits,
                    marks: marks,
                    gradePoint: gradePoint,
                    ciGi: ciGi
                });

                calculationDetails += `
                    <tr>
                        <td>Subject ${i}</td>
                        <td>${credits}</td>
                        <td>${marks}</td>
                        <td>${gradePoint}</td>
                        <td>${ciGi}</td>
                    </tr>
                `;
            }

            var sgpa = totalCiGi / totalCi;
            var percentage = (sgpa - 0.75) * 10;

            document.getElementById("result").innerHTML = "Your SGPA is: <span>" + sgpa.toFixed(2) + "</span><br>That's equivalent to: <span>" + percentage.toFixed(2) + "%</span>";

            const quotes = {
                high: ["Outstanding! Keep up the excellent work!", "You're on fire! Keep the momentum going!"],
                mid: ["Great job! A little more effort will take you even higher!", "You're doing well – keep pushing forward!"],
                low: ["Don't give up – every step forward is progress!", "Keep going – you're stronger than you think!"]
            };

            let selectedQuote;
            if (sgpa >= 9) {
                selectedQuote = quotes.high[Math.floor(Math.random() * quotes.high.length)];
            } else if (sgpa >= 6) {
                selectedQuote = quotes.mid[Math.floor(Math.random() * quotes.mid.length)];
            } else {
                selectedQuote = quotes.low[Math.floor(Math.random() * quotes.low.length)];
            }

            document.getElementById("message").innerHTML = selectedQuote;

            // Save semester data to new user structure
            const semesterData = {
                semester: semester,
                subjects: subjects,
                totalCredits: totalCi,
                totalCiGi: totalCiGi,
                sgpa: parseFloat(sgpa.toFixed(2)),
                percentage: parseFloat(percentage.toFixed(2)),
                message: selectedQuote,
                timestamp: new Date().toISOString()
            };
            
            const userData = saveUserData(usn, semesterData);
            
            // Update the display to show CGPA
            if (userData) {
                displayCGPA(userData);
            }

            // Store in session storage for print page
            sessionStorage.setItem('usn', usn);
            sessionStorage.setItem('semester', semester);
            sessionStorage.setItem('calculationDetails', calculationDetails);
            sessionStorage.setItem('totalCredits', totalCi);
            sessionStorage.setItem('totalCiGi', totalCiGi);
            sessionStorage.setItem('sgpa', sgpa.toFixed(2));
            sessionStorage.setItem('percentage', percentage.toFixed(2));
            sessionStorage.setItem('message', selectedQuote);

            document.getElementById("printBtn").style.display = 'inline-block';
        }

        function getGradePoint(marks) {
            if (marks >= 90 && marks <= 100) return 10;
            else if (marks >= 80 && marks <= 89) return 9;
            else if (marks >= 70 && marks <= 79) return 8;
            else if (marks >= 60 && marks <= 69) return 7;
            else if (marks >= 55 && marks <= 59) return 6;
            else if (marks >= 50 && marks <= 54) return 5;
            else if (marks >= 40 && marks <= 49) return 4;
            else return 0;
        }

        function printResult() {
            window.open('print.html');
        }
    </script>

    <footer>
        <p>&copy; 2024 SGPA Quest. All Rights Reserved. 🎓</p>
    </footer>
</body>
</html>
