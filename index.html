<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA Quest - Level Up Your Grades!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #20232a;
            color: #61dafb;
            text-align: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #282c34;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        /* User Info Section */
        .user-info {
            background: #393e46;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #61dafb;
        }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #61dafb;
            border-radius: 10px;
            background-color: #20232a;
            color: #61dafb;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #38a1db;
            box-shadow: 0 0 0 3px rgba(97, 218, 251, 0.1);
        }
        /* Table wrapper for mobile scrolling */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            min-width: 500px;
        }
        table, th, td {
            border: none;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #61dafb;
            color: #20232a;
            font-weight: bold;
            border-radius: 10px;
            font-size: 14px;
        }
        td {
            background-color: #393e46;
            border-radius: 10px;
        }
        td input[type="number"] {
            width: 90%;
            padding: 10px;
            border: 2px solid #61dafb;
            border-radius: 10px;
            background-color: #20232a;
            color: #61dafb;
            text-align: center;
            font-size: 16px;
        }
        .btn {
            padding: 12px 28px;
            background-color: #61dafb;
            color: #20232a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 8px;
            transition: transform 0.2s, background-color 0.3s;
            min-height: 44px; /* Touch target size for mobile */
            touch-action: manipulation;
        }
        .btn:hover {
            background-color: #38a1db;
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-remove {
            padding: 8px 16px;
            font-size: 14px;
            min-height: 40px;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            line-height: 1.6;
        }
        .result span {
            color: #f8c445;
            font-weight: bold;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
            color: #f8c445;
            line-height: 1.5;
            padding: 15px;
            background: rgba(248, 196, 69, 0.1);
            border-radius: 10px;
        }
        .avatar {
            display: block;
            margin: 20px auto;
            width: 100px;
            height: 100px;
            background: url('Designer.jpeg') no-repeat center center;
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        footer {
            background-color: #20232a;
            padding: 15px;
            margin-top: 40px;
            color: #61dafb;
            border-radius: 15px;
        }
        #printBtn {
            display: none;
        }

        /* Mobile-first responsive design */
        @media only screen and (min-width: 600px) {
            body {
                padding: 20px;
            }
            .container {
                padding: 30px;
            }
            h2 {
                font-size: 28px;
            }
            .avatar {
                width: 120px;
                height: 120px;
            }
        }
        
        /* Small mobile optimization */
        @media only screen and (max-width: 400px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            h2 {
                font-size: 20px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
                margin: 5px;
            }
            th, td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 SGPA Calculator! 🎮</h2>
        <div class="avatar"></div>
        
        <!-- User Information Section -->
        <div class="user-info">
            <div class="form-group">
                <label for="usn">📝 University Serial Number (USN)</label>
                <input type="text" id="usn" placeholder="Enter your USN (e.g., 1AB21CS001)" required>
            </div>
            <div class="form-group">
                <label for="semester">📅 Semester Number</label>
                <input type="number" id="semester" min="1" max="8" placeholder="Enter semester (1-8)" required>
            </div>
        </div>
        
        <div class="table-wrapper">
        <table id="gradeTable">
            <thead>
                <tr>
                    <th>📚 Credits (Ci)</th>
                    <th>✏️ Marks</th>
                    <th>🏆 Grade Point (Gi)</th>
                    <th>🛠️ Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="number" placeholder="Credits" required></td>
                    <td><input type="number" placeholder="Marks" required></td>
                    <td><input type="number" placeholder="Grade Point" readonly></td>
                    <td><button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button></td>
                </tr>
            </tbody>
        </table>
        </div>
        <button class="btn" onclick="addRow()">➕ Add Subject</button>
        <button class="btn" onclick="calculateSGPA()">💯 Calculate SGPA</button>
        <div class="result" id="result"></div>
        <div class="message" id="message"></div>
        <button class="btn" id="printBtn" onclick="printResult()">🖨️ Print Result</button>
    </div>

    <script>
        function addRow() {
            var table = document.getElementById("gradeTable").getElementsByTagName('tbody')[0];
            var row = table.insertRow(-1);
            var cell1 = row.insertCell(0);
            var cell2 = row.insertCell(1);
            var cell3 = row.insertCell(2);
            var cell4 = row.insertCell(3);
            
            cell1.innerHTML = '<input type="number" placeholder="Credits" required>';
            cell2.innerHTML = '<input type="number" placeholder="Marks" required>';
            cell3.innerHTML = '<input type="number" placeholder="Grade Point" readonly>';
            cell4.innerHTML = '<button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button>';
        }
        function removeRow(btn) {
            var row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }
        
        // Function to save data to JSON file (localStorage for browser)
        function saveToJSON(data) {
            // Get existing data or create new array
            let savedData = JSON.parse(localStorage.getItem('sgpaCalculations') || '[]');
            
            // Add timestamp and new data
            data.timestamp = new Date().toISOString();
            savedData.push(data);
            
            // Save back to localStorage
            localStorage.setItem('sgpaCalculations', JSON.stringify(savedData));
            
            // Also create a downloadable JSON file
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `sgpa_${data.usn}_sem${data.semester}_${Date.now()}.json`;
            
            // Auto-download is optional, but we'll save to localStorage
            // Uncomment the following lines if you want auto-download
            // document.body.appendChild(link);
            // link.click();
            // document.body.removeChild(link);
            
            console.log('Data saved to localStorage:', data);
        }
        
        function calculateSGPA() {
            // Validate USN and Semester
            const usn = document.getElementById('usn').value.trim();
            const semester = document.getElementById('semester').value;
            
            if (!usn) {
                alert('⚠️ Please enter your USN');
                document.getElementById('usn').focus();
                return;
            }
            
            if (!semester || semester < 1 || semester > 8) {
                alert('⚠️ Please enter a valid semester number (1-8)');
                document.getElementById('semester').focus();
                return;
            }
            
            var table = document.getElementById("gradeTable");
            var totalCi = 0;
            var totalCiGi = 0;
            var calculationDetails = "";
            var subjects = [];

            for (var i = 1, row; row = table.rows[i]; i++) {
                var credits = parseInt(row.cells[0].children[0].value);
                var marks = parseInt(row.cells[1].children[0].value);
                
                if (isNaN(credits) || isNaN(marks)) {
                    alert('⚠️ Please fill in all credits and marks');
                    return;
                }
                
                var gradePoint = getGradePoint(marks);
                var ciGi = credits * gradePoint;
                row.cells[2].children[0].value = gradePoint;

                totalCi += credits;
                totalCiGi += ciGi;
                
                // Store subject data
                subjects.push({
                    subjectNumber: i,
                    credits: credits,
                    marks: marks,
                    gradePoint: gradePoint,
                    ciGi: ciGi
                });

                calculationDetails += `
                    <tr>
                        <td>Subject ${i}</td>
                        <td>${credits}</td>
                        <td>${marks}</td>
                        <td>${gradePoint}</td>
                        <td>${ciGi}</td>
                    </tr>
                `;
            }

            var sgpa = totalCiGi / totalCi;
            var percentage = (sgpa - 0.75) * 10;

            document.getElementById("result").innerHTML = "Your SGPA is: <span>" + sgpa.toFixed(2) + "</span><br>That's equivalent to: <span>" + percentage.toFixed(2) + "%</span>";

            const quotes = {
                high: ["Outstanding! Keep up the excellent work!", "You're on fire! Keep the momentum going!"],
                mid: ["Great job! A little more effort will take you even higher!", "You're doing well – keep pushing forward!"],
                low: ["Don't give up – every step forward is progress!", "Keep going – you're stronger than you think!"]
            };

            let selectedQuote;
            if (sgpa >= 9) {
                selectedQuote = quotes.high[Math.floor(Math.random() * quotes.high.length)];
            } else if (sgpa >= 6) {
                selectedQuote = quotes.mid[Math.floor(Math.random() * quotes.mid.length)];
            } else {
                selectedQuote = quotes.low[Math.floor(Math.random() * quotes.low.length)];
            }

            document.getElementById("message").innerHTML = selectedQuote;

            // Save all data to JSON
            const calculationData = {
                usn: usn,
                semester: parseInt(semester),
                subjects: subjects,
                totalCredits: totalCi,
                totalCiGi: totalCiGi,
                sgpa: parseFloat(sgpa.toFixed(2)),
                percentage: parseFloat(percentage.toFixed(2)),
                message: selectedQuote
            };
            
            saveToJSON(calculationData);

            // Store in session storage for print page
            sessionStorage.setItem('usn', usn);
            sessionStorage.setItem('semester', semester);
            sessionStorage.setItem('calculationDetails', calculationDetails);
            sessionStorage.setItem('totalCredits', totalCi);
            sessionStorage.setItem('totalCiGi', totalCiGi);
            sessionStorage.setItem('sgpa', sgpa.toFixed(2));
            sessionStorage.setItem('percentage', percentage.toFixed(2));
            sessionStorage.setItem('message', selectedQuote);

            document.getElementById("printBtn").style.display = 'inline-block';
        }

        function getGradePoint(marks) {
            if (marks >= 90 && marks <= 100) return 10;
            else if (marks >= 80 && marks <= 89) return 9;
            else if (marks >= 70 && marks <= 79) return 8;
            else if (marks >= 60 && marks <= 69) return 7;
            else if (marks >= 55 && marks <= 59) return 6;
            else if (marks >= 50 && marks <= 54) return 5;
            else if (marks >= 40 && marks <= 49) return 4;
            else return 0;
        }

        function printResult() {
            window.open('print.html');
        }
    </script>

    <footer>
        <p>&copy; 2024 SGPA Quest. All Rights Reserved. 🎓</p>
    </footer>
</body>
</html>
