<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA Quest - Level Up Your Grades!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #20232a;
            color: #61dafb;
            text-align: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #282c34;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        /* User Info Section */
        .user-info {
            background: #393e46;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #61dafb;
        }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #61dafb;
            border-radius: 10px;
            background-color: #20232a;
            color: #61dafb;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #38a1db;
            box-shadow: 0 0 0 3px rgba(97, 218, 251, 0.1);
        }
        /* Table wrapper for mobile scrolling */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            min-width: 500px;
        }
        table, th, td {
            border: none;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #61dafb;
            color: #20232a;
            font-weight: bold;
            border-radius: 10px;
            font-size: 14px;
        }
        td {
            background-color: #393e46;
            border-radius: 10px;
        }
        td input[type="number"] {
            width: 90%;
            padding: 10px;
            border: 2px solid #61dafb;
            border-radius: 10px;
            background-color: #20232a;
            color: #61dafb;
            text-align: center;
            font-size: 16px;
        }
        .btn {
            padding: 12px 28px;
            background-color: #61dafb;
            color: #20232a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 8px;
            transition: transform 0.2s, background-color 0.3s;
            min-height: 44px; /* Touch target size for mobile */
            touch-action: manipulation;
        }
        .btn:hover {
            background-color: #38a1db;
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-remove {
            padding: 8px 16px;
            font-size: 14px;
            min-height: 40px;
        }
        .btn-secondary {
            background-color: #393e46;
            color: #61dafb;
            border: 2px solid #61dafb;
        }
        .btn-secondary:hover {
            background-color: #4a5568;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            line-height: 1.6;
        }
        .result span {
            color: #f8c445;
            font-weight: bold;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
            color: #f8c445;
            line-height: 1.5;
            padding: 15px;
            background: rgba(248, 196, 69, 0.1);
            border-radius: 10px;
        }
        .avatar {
            display: block;
            margin: 20px auto;
            width: 100px;
            height: 100px;
            background: url('Designer.jpeg') no-repeat center center;
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        footer {
            background-color: #20232a;
            padding: 15px;
            margin-top: 40px;
            color: #61dafb;
            border-radius: 15px;
        }
        #printBtn {
            display: none;
        }
        /* Dashboard styles */
        .dashboard {
            display: none;
            margin-top: 20px;
        }
        .semester-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .semester-card {
            background: linear-gradient(145deg, #393e46, #2d3139);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .semester-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border-color: #61dafb;
        }
        .semester-card.active {
            border-color: #f8c445;
        }
        .semester-card.has-data {
            background: linear-gradient(145deg, #2d5016, #1f3a0f);
        }
        .semester-card .sem-number {
            font-size: 18px;
            font-weight: bold;
            color: #61dafb;
        }
        .semester-card .sem-sgpa {
            font-size: 24px;
            color: #f8c445;
            margin-top: 8px;
        }
        .semester-card .sem-empty {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }
        .cgpa-card {
            background: linear-gradient(145deg, #5a3e1b, #3d2a12);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #f8c445;
        }
        .cgpa-card .cgpa-label {
            font-size: 16px;
            color: #61dafb;
        }
        .cgpa-card .cgpa-value {
            font-size: 36px;
            color: #f8c445;
            font-weight: bold;
            margin: 10px 0;
        }
        .cgpa-card .cgpa-percentage {
            font-size: 18px;
            color: #61dafb;
        }
        .hidden {
            display: none !important;
        }
        /* Data management section */
        .data-management {
            margin-top: 20px;
            padding: 15px;
            background: #2d3139;
            border-radius: 10px;
            text-align: center;
        }
        .data-management h4 {
            margin-top: 0;
            color: #61dafb;
        }
        #fileInput {
            display: none;
        }

        /* Mobile-first responsive design */
        @media only screen and (min-width: 600px) {
            body {
                padding: 20px;
            }
            .container {
                padding: 30px;
            }
            h2 {
                font-size: 28px;
            }
            .avatar {
                width: 120px;
                height: 120px;
            }
        }
        
        /* Small mobile optimization */
        @media only screen and (max-width: 400px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            h2 {
                font-size: 20px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
                margin: 5px;
            }
            th, td {
                padding: 8px;
                font-size: 12px;
            }
            .semester-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 SGPA Calculator! 🎮</h2>
        <div class="avatar"></div>
        
        <!-- Step 1: USN Entry -->
        <div id="usnEntry" class="user-info">
            <div class="form-group">
                <label for="usn">📝 University Serial Number (USN)</label>
                <input type="text" id="usn" placeholder="Enter your USN (e.g., 1AB21CS001)" required>
            </div>
            <button class="btn" onclick="checkUSN()">Continue</button>
        </div>
        
        <!-- Step 2: Username Entry (for new users) -->
        <div id="usernameEntry" class="user-info hidden">
            <h3 style="color: #f8c445; margin-top: 0;">👋 Welcome, New User!</h3>
            <div class="form-group">
                <label for="username">📛 Enter Your Name</label>
                <input type="text" id="username" placeholder="Enter your full name" required>
            </div>
            <button class="btn" onclick="registerNewUser()">Register & Continue</button>
            <button class="btn btn-secondary" onclick="goBackToUSN()">← Back</button>
        </div>
        
        <!-- Step 3: Dashboard (for existing users) -->
        <div id="dashboard" class="user-info hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <h3 style="color: #f8c445; margin: 0;">📊 <span id="welcomeUser"></span>'s Dashboard</h3>
                <button class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;" onclick="logout()">🚪 Logout</button>
            </div>
            <p style="color: #888; margin: 10px 0;">USN: <span id="displayUSN"></span></p>
            
            <h4 style="color: #61dafb; margin-top: 20px;">Select a Semester</h4>
            <div class="semester-cards" id="semesterCards">
                <!-- Semester cards will be generated by JavaScript -->
            </div>
            
            <div id="cgpaCardContainer">
                <!-- CGPA card will be generated by JavaScript -->
            </div>
        </div>
        
        <!-- Step 4: Semester Input Form -->
        <div id="semesterForm" class="hidden">
            <div class="user-info">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                    <h3 style="color: #f8c445; margin: 0;">📝 Semester <span id="currentSemester"></span></h3>
                    <button class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;" onclick="goBackToDashboard()">← Back to Dashboard</button>
                </div>
            </div>
        
            <div class="table-wrapper">
            <table id="gradeTable">
                <thead>
                    <tr>
                        <th>📚 Credits (Ci)</th>
                        <th>✏️ Marks</th>
                        <th>🏆 Grade Point (Gi)</th>
                        <th>🛠️ Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="number" placeholder="Credits" required></td>
                        <td><input type="number" placeholder="Marks" required></td>
                        <td><input type="number" placeholder="Grade Point" readonly></td>
                        <td><button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button></td>
                    </tr>
                </tbody>
            </table>
            </div>
            <button class="btn" onclick="addRow()">➕ Add Subject</button>
            <button class="btn" onclick="calculateSGPA()">💯 Calculate SGPA</button>
            <div class="result" id="result"></div>
            <div class="message" id="message"></div>
            <button class="btn" id="printBtn" onclick="printResult()">🖨️ Print Result</button>
        </div>
        
        <!-- Data Management Section -->
        <div class="data-management">
            <h4>💾 Data Management</h4>
            <p style="color: #888; font-size: 14px;">Export your data as JSON file or import from a previously saved file</p>
            <button class="btn btn-secondary" onclick="exportToJSON()">📥 Export Data</button>
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📤 Import Data</button>
            <input type="file" id="fileInput" accept=".json" onchange="importFromJSON(event)">
        </div>
    </div>

    <script>
        // Global state
        let currentUSN = '';
        let currentSemesterNum = null;
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            // Try to load data from localStorage (migrated from JSON file if previously exported)
            loadFromLocalStorage();
        });
        
        // ========== USN and User Flow Functions ==========
        
        function checkUSN() {
            const usn = document.getElementById('usn').value.trim().toUpperCase();
            if (!usn) {
                alert('⚠️ Please enter your USN');
                return;
            }
            
            currentUSN = usn;
            const userData = getUserData(usn);
            
            if (userData && userData.username) {
                // Existing user - show dashboard
                showDashboard(userData);
            } else {
                // New user - show username entry
                showUsernameEntry();
            }
        }
        
        function showUsernameEntry() {
            document.getElementById('usnEntry').classList.add('hidden');
            document.getElementById('usernameEntry').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('semesterForm').classList.add('hidden');
        }
        
        function goBackToUSN() {
            document.getElementById('usnEntry').classList.remove('hidden');
            document.getElementById('usernameEntry').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('semesterForm').classList.add('hidden');
        }
        
        function registerNewUser() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                alert('⚠️ Please enter your name');
                return;
            }
            
            // Create new user
            const allUsers = getAllUsers();
            allUsers[currentUSN] = {
                usn: currentUSN,
                username: username,
                semesters: {},
                createdAt: new Date().toISOString()
            };
            saveAllUsers(allUsers);
            
            // Show dashboard
            showDashboard(allUsers[currentUSN]);
        }
        
        function showDashboard(userData) {
            document.getElementById('usnEntry').classList.add('hidden');
            document.getElementById('usernameEntry').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('semesterForm').classList.add('hidden');
            
            // Update welcome message
            document.getElementById('welcomeUser').textContent = userData.username || userData.usn;
            document.getElementById('displayUSN').textContent = userData.usn;
            
            // Generate semester cards
            generateSemesterCards(userData);
            
            // Generate CGPA card
            generateCGPACard(userData);
        }
        
        function generateSemesterCards(userData) {
            const container = document.getElementById('semesterCards');
            container.innerHTML = '';
            
            for (let sem = 1; sem <= 8; sem++) {
                const card = document.createElement('div');
                card.className = 'semester-card';
                
                const semData = userData.semesters[sem];
                if (semData) {
                    card.classList.add('has-data');
                    card.innerHTML = `
                        <div class="sem-number">Semester ${sem}</div>
                        <div class="sem-sgpa">SGPA: ${semData.sgpa}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="sem-number">Semester ${sem}</div>
                        <div class="sem-empty">No data</div>
                    `;
                }
                
                card.onclick = function() { openSemester(sem); };
                container.appendChild(card);
            }
        }
        
        function generateCGPACard(userData) {
            const container = document.getElementById('cgpaCardContainer');
            const semesters = userData.semesters;
            const semesterNumbers = Object.keys(semesters).map(Number).sort((a, b) => a - b);
            
            if (semesterNumbers.length === 0) {
                container.innerHTML = `
                    <div class="cgpa-card" style="background: #2d3139; border-color: #61dafb;">
                        <div class="cgpa-label">📊 Cumulative GPA</div>
                        <div class="cgpa-value" style="font-size: 20px; color: #888;">No semester data yet</div>
                        <div class="cgpa-percentage">Add your first semester to see CGPA</div>
                    </div>
                `;
                return;
            }
            
            // Calculate CGPA
            let totalCredits = 0;
            let totalCiGi = 0;
            
            semesterNumbers.forEach(sem => {
                const semData = semesters[sem];
                totalCredits += semData.totalCredits || 0;
                totalCiGi += semData.totalCiGi || 0;
            });
            
            if (totalCredits === 0) {
                container.innerHTML = `
                    <div class="cgpa-card" style="background: #2d3139; border-color: #61dafb;">
                        <div class="cgpa-label">📊 Cumulative GPA</div>
                        <div class="cgpa-value" style="font-size: 20px; color: #888;">Invalid credit data</div>
                    </div>
                `;
                return;
            }
            
            const cgpa = totalCiGi / totalCredits;
            // VTU official formula for CGPA to Percentage conversion: Percentage = (CGPA - 0.5) * 10
            const cgpaPercentage = (cgpa - 0.5) * 10;
            
            container.innerHTML = `
                <div class="cgpa-card">
                    <div class="cgpa-label">📊 Cumulative GPA (${semesterNumbers.length} semester${semesterNumbers.length > 1 ? 's' : ''})</div>
                    <div class="cgpa-value">${cgpa.toFixed(2)}</div>
                    <div class="cgpa-percentage">Equivalent to: ${cgpaPercentage.toFixed(2)}%</div>
                </div>
            `;
        }
        
        function openSemester(semNum) {
            currentSemesterNum = semNum;
            
            document.getElementById('usnEntry').classList.add('hidden');
            document.getElementById('usernameEntry').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('semesterForm').classList.remove('hidden');
            
            document.getElementById('currentSemester').textContent = semNum;
            
            // Load existing semester data if available
            const userData = getUserData(currentUSN);
            const table = document.getElementById("gradeTable").getElementsByTagName('tbody')[0];
            table.innerHTML = '';
            
            if (userData && userData.semesters[semNum]) {
                const semData = userData.semesters[semNum];
                
                // Load saved subjects
                semData.subjects.forEach(subject => {
                    const row = table.insertRow(-1);
                    row.innerHTML = `
                        <td><input type="number" placeholder="Credits" value="${subject.credits}" required></td>
                        <td><input type="number" placeholder="Marks" value="${subject.marks}" required></td>
                        <td><input type="number" placeholder="Grade Point" value="${subject.gradePoint}" readonly></td>
                        <td><button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button></td>
                    `;
                });
                
                // Display SGPA for this semester
                document.getElementById("result").innerHTML = 
                    'Saved SGPA for Semester ' + semNum + ': <span>' + semData.sgpa + '</span><br>' +
                    'Equivalent to: <span>' + semData.percentage + '%</span>';
                document.getElementById("message").textContent = semData.message || '';
                document.getElementById("printBtn").style.display = 'inline-block';
            } else {
                // Add empty row for new semester
                const row = table.insertRow(-1);
                row.innerHTML = `
                    <td><input type="number" placeholder="Credits" required></td>
                    <td><input type="number" placeholder="Marks" required></td>
                    <td><input type="number" placeholder="Grade Point" readonly></td>
                    <td><button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button></td>
                `;
                document.getElementById("result").innerHTML = '';
                document.getElementById("message").textContent = '';
                document.getElementById("printBtn").style.display = 'none';
            }
        }
        
        function goBackToDashboard() {
            const userData = getUserData(currentUSN);
            if (userData) {
                showDashboard(userData);
            } else {
                goBackToUSN();
            }
        }
        
        function logout() {
            currentUSN = '';
            currentSemesterNum = null;
            document.getElementById('usn').value = '';
            document.getElementById('username').value = '';
            goBackToUSN();
        }
        
        // ========== Table Functions ==========
        
        function addRow() {
            var table = document.getElementById("gradeTable").getElementsByTagName('tbody')[0];
            var row = table.insertRow(-1);
            var cell1 = row.insertCell(0);
            var cell2 = row.insertCell(1);
            var cell3 = row.insertCell(2);
            var cell4 = row.insertCell(3);
            
            cell1.innerHTML = '<input type="number" placeholder="Credits" required>';
            cell2.innerHTML = '<input type="number" placeholder="Marks" required>';
            cell3.innerHTML = '<input type="number" placeholder="Grade Point" readonly>';
            cell4.innerHTML = '<button class="btn btn-remove" onclick="removeRow(this)">🗑️ Remove</button>';
        }
        
        function removeRow(btn) {
            var row = btn.parentNode.parentNode;
            row.remove();
        }
        
        // ========== SGPA Calculation Functions ==========
        
        function calculateSGPA() {
            if (!currentUSN) {
                alert('⚠️ Please enter your USN first');
                return;
            }
            
            if (!currentSemesterNum) {
                alert('⚠️ Please select a semester');
                return;
            }
            
            var table = document.getElementById("gradeTable");
            
            // Check if any subjects are entered before processing
            if (table.rows.length <= 1) {
                alert('⚠️ Please add at least one subject');
                return;
            }
            
            var totalCi = 0;
            var totalCiGi = 0;
            var calculationDetails = "";
            var subjects = [];

            for (var i = 1, row; row = table.rows[i]; i++) {
                var credits = parseInt(row.cells[0].children[0].value);
                var marks = parseInt(row.cells[1].children[0].value);
                
                if (isNaN(credits) || isNaN(marks)) {
                    alert('⚠️ Please fill in all credits and marks');
                    return;
                }
                
                if (credits <= 0) {
                    alert('⚠️ Credits must be greater than zero');
                    return;
                }
                
                if (marks < 0 || marks > 100) {
                    alert('⚠️ Marks must be between 0 and 100');
                    return;
                }
                
                var gradePoint = getGradePoint(marks);
                var ciGi = credits * gradePoint;
                row.cells[2].children[0].value = gradePoint;

                totalCi += credits;
                totalCiGi += ciGi;
                
                // Store subject data
                subjects.push({
                    subjectNumber: i,
                    credits: credits,
                    marks: marks,
                    gradePoint: gradePoint,
                    ciGi: ciGi
                });

                calculationDetails += `
                    <tr>
                        <td>Subject ${i}</td>
                        <td>${credits}</td>
                        <td>${marks}</td>
                        <td>${gradePoint}</td>
                        <td>${ciGi}</td>
                    </tr>
                `;
            }

            var sgpa = totalCiGi / totalCi;
            // VTU official formula for SGPA to Percentage conversion: Percentage = (SGPA - 0.5) * 10
            var percentage = (sgpa - 0.5) * 10;

            document.getElementById("result").innerHTML = "Your SGPA is: <span>" + sgpa.toFixed(2) + "</span><br>That's equivalent to: <span>" + percentage.toFixed(2) + "%</span>";

            const quotes = {
                high: ["Outstanding! Keep up the excellent work!", "You're on fire! Keep the momentum going!"],
                mid: ["Great job! A little more effort will take you even higher!", "You're doing well – keep pushing forward!"],
                low: ["Don't give up – every step forward is progress!", "Keep going – you're stronger than you think!"]
            };

            let selectedQuote;
            if (sgpa >= 9) {
                selectedQuote = quotes.high[Math.floor(Math.random() * quotes.high.length)];
            } else if (sgpa >= 6) {
                selectedQuote = quotes.mid[Math.floor(Math.random() * quotes.mid.length)];
            } else {
                selectedQuote = quotes.low[Math.floor(Math.random() * quotes.low.length)];
            }

            document.getElementById("message").innerHTML = selectedQuote;

            // Save semester data
            const semesterData = {
                semester: currentSemesterNum,
                subjects: subjects,
                totalCredits: totalCi,
                totalCiGi: totalCiGi,
                sgpa: parseFloat(sgpa.toFixed(2)),
                percentage: parseFloat(percentage.toFixed(2)),
                message: selectedQuote,
                timestamp: new Date().toISOString()
            };
            
            saveUserSemesterData(currentUSN, semesterData);

            // Store in session storage for print page
            sessionStorage.setItem('usn', currentUSN);
            sessionStorage.setItem('semester', currentSemesterNum);
            sessionStorage.setItem('calculationDetails', calculationDetails);
            sessionStorage.setItem('totalCredits', totalCi);
            sessionStorage.setItem('totalCiGi', totalCiGi);
            sessionStorage.setItem('sgpa', sgpa.toFixed(2));
            sessionStorage.setItem('percentage', percentage.toFixed(2));
            sessionStorage.setItem('message', selectedQuote);

            document.getElementById("printBtn").style.display = 'inline-block';
        }

        function getGradePoint(marks) {
            if (marks >= 90 && marks <= 100) return 10;
            else if (marks >= 80 && marks <= 89) return 9;
            else if (marks >= 70 && marks <= 79) return 8;
            else if (marks >= 60 && marks <= 69) return 7;
            else if (marks >= 55 && marks <= 59) return 6;
            else if (marks >= 50 && marks <= 54) return 5;
            else if (marks >= 40 && marks <= 49) return 4;
            else return 0;
        }

        function printResult() {
            window.open('print.html');
        }
        
        // ========== Data Storage Functions ==========
        
        function getAllUsers() {
            try {
                return JSON.parse(localStorage.getItem('sgpaUsers') || '{}');
            } catch (e) {
                console.error('Error loading users:', e);
                return {};
            }
        }
        
        function saveAllUsers(users) {
            try {
                localStorage.setItem('sgpaUsers', JSON.stringify(users));
            } catch (e) {
                console.error('Error saving users:', e);
            }
        }
        
        function getUserData(usn) {
            try {
                const allUsers = getAllUsers();
                return allUsers[usn] || null;
            } catch (e) {
                console.error('Error loading user data:', e);
                return null;
            }
        }
        
        function saveUserSemesterData(usn, semesterData) {
            try {
                const allUsers = getAllUsers();
                
                if (!allUsers[usn]) {
                    allUsers[usn] = {
                        usn: usn,
                        username: '',
                        semesters: {},
                        createdAt: new Date().toISOString()
                    };
                }
                
                allUsers[usn].semesters[semesterData.semester] = semesterData;
                allUsers[usn].lastUpdated = new Date().toISOString();
                
                saveAllUsers(allUsers);
                console.log('User data saved:', allUsers[usn]);
                
                return allUsers[usn];
            } catch (e) {
                console.error('Error saving user data:', e);
                return null;
            }
        }
        
        function loadFromLocalStorage() {
            // This function ensures backward compatibility
            // Data is automatically available from localStorage
            const allUsers = getAllUsers();
            const userCount = Object.keys(allUsers).length;
            console.log(`App initialized. Loaded ${userCount} user(s) from localStorage.`);
        }
        
        // ========== JSON File Import/Export Functions ==========
        
        function exportToJSON() {
            const allUsers = getAllUsers();
            
            if (Object.keys(allUsers).length === 0) {
                alert('⚠️ No data to export. Please add some semester data first.');
                return;
            }
            
            const dataStr = JSON.stringify(allUsers, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `sgpa_data_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('✅ Data exported successfully!');
        }
        
        function importFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Validate the structure
                    if (typeof importedData !== 'object') {
                        throw new Error('Invalid data format');
                    }
                    
                    // Merge with existing data
                    const existingUsers = getAllUsers();
                    const mergedUsers = { ...existingUsers, ...importedData };
                    
                    saveAllUsers(mergedUsers);
                    
                    alert('✅ Data imported successfully! ' + Object.keys(importedData).length + ' user(s) imported.');
                    
                    // Refresh if user is logged in
                    if (currentUSN) {
                        const userData = getUserData(currentUSN);
                        if (userData) {
                            showDashboard(userData);
                        }
                    }
                } catch (error) {
                    alert('❌ Error importing data: ' + error.message);
                }
            };
            reader.readAsText(file);
            
            // Reset file input
            event.target.value = '';
        }
    </script>
